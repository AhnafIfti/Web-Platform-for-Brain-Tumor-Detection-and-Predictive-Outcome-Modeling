# Local container setup. See README before production deployment.
services:
  backend:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://neurovision:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@database:5432/neurovision
    ports: ["127.0.0.1:9131:9131"]
    volumes: ["mri_data:/app/media", "./ml_models/checkpoints:/app/ml_models/checkpoints:ro"]
    depends_on:
      database: {condition: service_healthy}
  worker:
    build: .
    command: python manage.py run_analysis_worker
    env_file: .env
    environment:
      DATABASE_URL: postgres://neurovision:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@database:5432/neurovision
    volumes: ["mri_data:/app/media", "./ml_models/checkpoints:/app/ml_models/checkpoints:ro"]
    depends_on:
      database: {condition: service_healthy}
  frontend:
    image: nginx:stable-alpine
    ports: ["127.0.0.1:9130:9130"]
    volumes: ["./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [backend]
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: neurovision
      POSTGRES_USER: neurovision
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: ["database_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neurovision"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  database_data:
  mri_data:
